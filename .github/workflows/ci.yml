```yaml
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependências
        run: dotnet restore src/UnitTestingTutorial.slnx

      - name: Compilar projeto
        run: dotnet build src/UnitTestingTutorial.slnx --no-restore

      - name: Executar testes com cobertura
        run: dotnet test src/UnitTestingTutorial.slnx --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-cobertura-xml
          path: ./TestResults/**/coverage.cobertura.xml
```

### Depois de salvar

No CMD, rode:

```cmd
git status
```

Deve aparecer:

```text
modified:   .github/workflows/ci.yml
```

Depois:

```cmd
git add .github/workflows/ci.yml
```

```cmd
git commit -m "ci: adiciona cobertura de testes"
```

```cmd
git push origin main
```

⚠️ **Importante:** esse push vai iniciar o **CI #4**. Ele precisa terminar verde. Depois vamos entrar nessa execução e verificar se apareceu o artifact **`cobertura-cobertura-xml`**.

Me manda o resultado do `git push` e seguimos daí.